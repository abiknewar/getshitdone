name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages on every push to the
# development branch. One-time setup: repo Settings → Pages → Source = "GitHub
# Actions", and add repo secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions). See SETUP.md.

on:
  push:
    branches:
      - claude/productivity-voice-tasks-q01ccx
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Best-effort: turn on GitHub Pages automatically so you don't have to
      # flip the setting by hand. If your org blocks API enablement this step
      # is a no-op and you enable Pages once in Settings → Pages (see SETUP.md).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # SPA fallback (harmless with HashRouter, useful if base changes)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
